<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <h1>To-Do App</h1>
      <p>เพิ่ม ติ๊กเสร็จ ลบ — บันทึกอัตโนมัติในเบราว์เซอร์ ไม่หายตอนรีเฟรช</p>
    </header>

    <div class="card">
      <div class="input-row">
        <input type="text" id="TaskInput" placeholder="เพิ่มงานใหม่...">
        <button id="AddTaskButton" type="button">เพิ่ม</button>
      </div>
      <ul id="List"></ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
